/* Relay globe No. 1: GossipSub v1.1 attacks on a hand-inked desk globe (task G.1, supersedes spec §8 and the sorter).
   Same mechanism, toy constants: the numbers are the simulator's toy constants, never a mainnet node's.

   How it works (each button is one real step; things only move along their real path):
   - Post: Mumbai publishes. Eight capsules leave at once (flood publish): three down its mesh arcs, five down thin
     flood arcs to its nearest non-mesh stations. Every station that receives lights its hut and forwards along its
     own mesh arcs (one hop per 0.55 s); a copy arriving at a station that has already seen it just vanishes (seen).
     `delivered` counts stations reached, the publisher included.
   - Heartbeat: one tick of the engine's heartbeat, in the engine's order: decay (P4 x0.5, P1 +0.5 up to 5) ->
     spam pre-pass (every bolted-on Sybil spits a grey junk capsule down each of its arcs: invalid, P4 -10) ->
     prune (a station scoring under -10 loses its arcs; a Sybil is ejected and drops off the globe) ->
     graft (dropped arcs re-attach, a few per beat, while both ends score above -5).
     A spamming Sybil reads -10 on its first beat and -15 on the second, so it is pruned on the second heartbeat.
   - Sybil: five red stations bolt on beside honest ones and graft arcs into three honest meshes each.
   - Eclipse: four silent dark stations ring Tokyo and a glass hood lowers over it; Tokyo's honest arcs go dark,
     capsules bounce off the hood, its dial sits at the P3 floor (-0.25) and moves no further.
   - Partition: an ink bulkhead rises along the Atlantic (a tilted great circle from the Skagerrak through the Strait
     of Dover and Biscay to the South Atlantic); capsules bounce off it, so Mumbai's next Post reaches the eastern seven only; dials on both sides
     drift (P3 -0.25 a beat).
   - Heal: the hood lifts, the dark stations leave, the wall drops; the dropped arcs re-graft over two heartbeats.
   Stats: mesh 12 · D 3 (toy) . delivered n/12 . score <station> . beat N . status pill while attacked:
   tokyo eclipsed · scoring blind, or partition (toy).

   Coordinates: x = depth, y = width, z = up; 1 unit ~ 1 cm of a desk globe. Globe radius 28, centre (40, 40, 40);
   lon/lat go to the unit sphere (y mirrored because the engine's frame is left-handed) and then to the model.
   There is no depth buffer: every land segment, arc segment, station, wall and hood piece is drawn only when the
   surface normal under it faces the camera (dot with CAM_V > 0), recomputed every frame; the meridian ring is split
   into segments sorted against the sphere by depth.

   Parts list (34), grouped:
   CASE (3):       sphere shell (loft, 16 bands x 32) . land (110m coastlines, 1.5 deg, ink hatch on paper) .
                   silhouette ink
   STRUCTURE (8):  turned brass foot (two tiers) . maker's plate RELAY GLOBE No. 1 . stem . stem collar .
                   meridian half-ring (20 segments) . south axle pin . north axle pin . finial
   MECHANISM (12): 12 relay huts on map pins (Reykjavik, London, Frankfurt, Helsinki, New York, Toronto, Sao Paulo,
                   Mumbai, Singapore, Tokyo, Sydney, Nairobi), each with a score dial (-20..+5, GRAFT bar at -5,
                   PRUNE and a flame tick at -10) . 18 mesh arcs (great circles lifted 6% of the radius, D = 3) .
                   arc collars at both ends . capsules (cream, ink band; grey junk) . 5 flood arcs during a Post
   ATTACKS (8):    5 Sybil huts (flame) . their 15 arcs . 4 dark eclipse huts . their 4 arcs . glass hood (flame rim) .
                   Atlantic bulkhead (flame top edge) . ejected Sybils falling into the shadow . seen capsules
   CONTROLS (3):   Post (also: press the Mumbai hut) . Heartbeat . Sybil / Eclipse / Partition / Heal
   Held by: the foot stands on the paper; the stem on the foot; the ring on the stem; the sphere on the two axle pins
   in the ring; huts on their pins in the surface; arcs from collar to collar on the huts; the hood and the wall stand
   on the surface. */
