<!doctype html><html><head><meta charset="utf-8"><title>Luminar banner</title>
<style>
@font-face{font-family:Geist;src:url(../fonts/geist-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Geist;src:url(../fonts/geist-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Geist Mono";src:url(../fonts/geist-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Geist Mono";src:url(../fonts/geist-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
html,body{margin:0;background:#111113}
.b{position:relative;width:1280px;height:400px;overflow:hidden;background:#111113;color:#ededef;font-family:Geist,system-ui,sans-serif}
.b svg{position:absolute;inset:0}
.t{position:absolute;left:72px;top:96px}
h1{margin:0;font-size:88px;font-weight:600;letter-spacing:-0.035em;line-height:1}
h1 span{color:oklch(72% 0.166 60)}
p{margin:22px 0 0;font-size:24px;font-weight:500;color:#b4b4b8;letter-spacing:-0.01em;max-width:620px;line-height:1.3}
.k{position:absolute;left:72px;bottom:46px;display:flex;gap:10px;font-family:"Geist Mono",monospace;font-size:13px;color:#8a8a8f}
.k span{border:1px solid #2d2d30;border-radius:999px;padding:6px 12px;background:#161618}
.k .a{color:oklch(80% 0.117 60);border-color:oklch(24% 0.063 60 / 0.9)}
.k .d{color:oklch(78% 0.15 22)}
</style></head><body><div class="b">
<svg viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="g" cx="0.78" cy="0.5" r="0.55"><stop offset="0" stop-color="oklch(24% 0.063 60)" stop-opacity="0.9"/><stop offset="1" stop-color="#111113" stop-opacity="0"/></radialGradient>
<filter id="f"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="1280" height="400" fill="url(#g)"/>
<g id="mesh"></g>
</svg>
<div class="t"><h1>Lum<span>i</span>nar</h1><p>A real-time GossipSub v1.1 simulator. Watch peer scoring prune a Sybil flood, an eclipse close around a node, and a real mainnet block wave cross the world map.</p></div>
<div class="k"><span class="a">GossipSub v1.1</span><span>P1–P4 scoring</span><span class="d">Sybil · Eclipse · Partition</span><span>OpenTelemetry</span><span>deck.gl</span><span class="a">Live ETH mainnet</span></div>
</div>
<script>
// deterministic scale-free-ish mesh on the right half, drawn with the UI's palette
let s=7;const rnd=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};
const N=70,nodes=[],edges=[];const cx=990,cy=200;
for(let i=0;i<N;i++){const a=rnd()*Math.PI*2,r=40+Math.pow(rnd(),0.55)*210;nodes.push({x:cx+Math.cos(a)*r*1.25,y:cy+Math.sin(a)*r*0.8,d:0,att:i>=N-4})}
for(let i=1;i<N;i++){const k=i<8?3:1+(rnd()<0.35?1:0);const cand=[...Array(i).keys()].sort((a,b)=>nodes[b].d-nodes[a].d+ (rnd()-0.5)*4).slice(0,k);for(const j of cand){edges.push([i,j]);nodes[i].d++;nodes[j].d++}}
const g=document.getElementById('mesh');const ns='http://www.w3.org/2000/svg';
const amber='oklch(72% 0.166 60)',red='oklch(64% 0.245 25)';
for(const [i,j] of edges){const l=document.createElementNS(ns,'line');const att=nodes[i].att||nodes[j].att;l.setAttribute('x1',nodes[i].x);l.setAttribute('y1',nodes[i].y);l.setAttribute('x2',nodes[j].x);l.setAttribute('y2',nodes[j].y);l.setAttribute('stroke',att?red:(rnd()<0.3?amber:'#3b3b3e'));l.setAttribute('stroke-opacity',att?0.5:(rnd()<0.3?0.55:0.9));l.setAttribute('stroke-width',att?1.2:1);g.appendChild(l)}
for(const n of nodes){const glow=document.createElementNS(ns,'circle');const r=2.2+Math.min(n.d,9)*0.55;glow.setAttribute('cx',n.x);glow.setAttribute('cy',n.y);glow.setAttribute('r',r*2.4);glow.setAttribute('fill',n.att?red:amber);glow.setAttribute('fill-opacity',n.d>6||n.att?0.18:0.06);glow.setAttribute('filter','url(#f)');g.appendChild(glow);const c=document.createElementNS(ns,'circle');c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',r);c.setAttribute('fill',n.att?red:(n.d>5?amber:'#d4d4d8'));g.appendChild(c)}
// a message wave: ring from the hub
const hub=nodes.reduce((a,b)=>a.d>b.d?a:b);for(const rr of [36,70]){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',hub.x);c.setAttribute('cy',hub.y);c.setAttribute('r',rr);c.setAttribute('stroke',amber);c.setAttribute('stroke-opacity',rr<50?0.5:0.22);c.setAttribute('stroke-width',1.5);g.appendChild(c)}
</script></body></html>
